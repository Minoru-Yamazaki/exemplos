spring:
  application:
    name: exemplos

  h2:
    console:
      enabled: true
      path: /h2

  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Redis (Spring Boot 3.x)
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379
  #     password: ""

server:
  port: 8080
